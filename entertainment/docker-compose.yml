version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_DATABASE: entertainment_db
      MYSQL_ROOT_PASSWORD: 7539
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  entertainment-app:
    build: .
    container_name: entertainment-app
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=mysql-db
    depends_on:
      - mysql-db

volumes:
  mysql_data:
