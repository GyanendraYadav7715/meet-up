plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.3'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.flywaydb.flyway' version '10.15.0'         // ✅ Flyway plugin added
}

group = 'com.gyan'
version = '0.0.1-SNAPSHOT'
description = 'entertainment'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Core
	implementation 'org.springframework.boot:spring-boot-starter-web'          // ✅ fixed
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'     // ✅ added

	// Flyway
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-mysql'

	// Database
	runtimeOnly 'com.mysql:mysql-connector-j'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// Test
	testImplementation 'org.springframework.boot:spring-boot-starter-test'     // ✅ fixed
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// ✅ Flyway plugin config (for running migrations from CLI: ./gradlew flywayMigrate)
flyway {
	url = 'jdbc:mysql://localhost:3306/entertainment_db'
	user = 'root'
	password = '7539'
	locations = ['classpath:db/migration']
}

tasks.named('test') {
	useJUnitPlatform()
}