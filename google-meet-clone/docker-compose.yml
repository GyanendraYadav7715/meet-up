version: '3.8'

services:
  # The MongoDB Database Service
  mongo:
    image: mongo:latest
    container_name: meet-clone-mongo
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    networks:
      - meet-network

  # The Node.js Express/Socket.io Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meet-clone-backend
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/google-meet-clone
      - JWT_SECRET=supersecretjwtkeyforgooglemeetclone
    depends_on:
      - mongo
    networks:
      - meet-network

  # The React Frontend mapped to default HTTP Port
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: meet-clone-frontend
    ports:
      - '3000:80'
    depends_on:
      - backend
    networks:
      - meet-network

volumes:
  mongo-data:


networks:
  meet-network:
    driver: bridge
